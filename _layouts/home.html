---
layout: default
---
<header class="hero">
  <h1 class="hero-name">{{ site.author.name }}</h1>
  <p class="hero-tagline">{{ site.tagline }}</p>
</header>

<div class="prose intro">
  {{ content }}
</div>

<p class="links-row">
  <a href="mailto:{{ site.author.email }}">Email</a><span class="sep">/</span><a href="{{ '/cv/' | relative_url }}">CV</a><span class="sep">/</span><a href="https://scholar.google.com/citations?user=ofH9ujMAAAAJ&amp;hl=en">Google Scholar</a><span class="sep">/</span><a href="https://github.com/yfeng0206">GitHub</a><span class="sep">/</span><a href="https://www.linkedin.com/in/garyfeng/">LinkedIn</a>
</p>

<h2 class="section-head">Work</h2>
{%- for job in site.data.work %}
<div class="job-row">
  <span class="job-period">{{ job.period }}</span>
  <span class="job-body">
    <span class="job-role">{{ job.role }}</span><span class="job-org">{{ job.org }}</span>
    <span class="job-note">{{ job.note }}</span>
  </span>
</div>
{%- endfor %}
<p class="more-link"><a href="{{ '/cv/' | relative_url }}">Full CV &rarr;</a></p>
