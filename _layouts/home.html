<h2 class="section-head">Experience</h2>
{%- for job in site.data.work %}
<div class="job-row">
  <span class="job-period">{{ job.period }}</span>
  <span class="job-body">
    <span class="job-role">{{ job.role }}</span><span class="job-org">{{ job.org }}</span>
    <span class="job-note">{{ job.note }}</span>
  </span>
</div>
{%- endfor %}
<p class="more-link"><a href="{{ '/cv/' | relative_url }}">Full CV &rarr;</a></p>
