- title: "Evolution of Humanoid Locomotion Control"
  authors: "Y. Gu, G. Shi, ... **Y. Feng**, ... H. Su, K. Sreenath"
  venue: "Science Robotics, vol. 11, no. 117"
  venue_short: "Science Robotics"
  year: 2026
  role: "contributing author"
  doi: "10.1126/scirobotics.aed3973"
  url: "https://doi.org/10.1126/scirobotics.aed3973"
  teaser: /assets/images/sel-scirob.png
  teaser_alt: "Figure 1 from the paper: three panels showing the progression from stable locomotion to agile locomotion to loco-manipulation"
  teaser_credit: "Figure 1 from the paper. Robot images courtesy of Unitree."
  summary: "A survey of how robots learn to walk, from hand-written control equations through to methods that learn from experience."
  detail: "Covers balance control, motion planning, and optimization, spanning classical algorithms such as MPC, LQR, and DCM alongside the reinforcement-learning and sim-to-real approaches that now drive bipedal and humanoid locomotion."
