name: Validate site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install structural checker dependency
        run: python -m pip install PyYAML
      - name: Check source structure
        run: python tools/validate_site.py
      - name: Audit stylesheet references
        run: python tools/css_audit.py
      - name: Build with the GitHub Pages Jekyll environment
        uses: actions/jekyll-build-pages@v1
      - name: Check rendered links and assets
        run: python tools/verify_built_site.py
