# ---------------------------------------------------------------
# Site
# ---------------------------------------------------------------
title: "Yunchu (Gary) Feng"
tagline: "Machine learning engineer. Computer vision, robotics, self-supervised learning."
description: "Personal site of Yunchu (Gary) Feng: machine learning engineer at Microsoft, researching self-supervised representation learning for medical imaging and robot manipulation."
url: "https://yfeng0206.github.io"
baseurl: ""
locale: "en-US"
repository: "yfeng0206/yfeng0206.github.io"
timezone: America/Los_Angeles

author:
  name: "Yunchu (Gary) Feng"
  email: "yfeng26@engineering.upenn.edu"
  avatar: "/assets/images/bio-photo.jpg"
  location: "Seattle, WA"

# ---------------------------------------------------------------
# Build
# ---------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge

include:
  - _pages

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# ---------------------------------------------------------------
# Collections
# ---------------------------------------------------------------
collections:
  research:
    output: true
    permalink: /research/:path/
  projects:
    output: true
    permalink: /projects/:path/

# Posts live at /writing/<slug>/
permalink: /writing/:title/

# ---------------------------------------------------------------
# Front matter defaults
# ---------------------------------------------------------------
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: research
    values:
      layout: work
  - scope:
      path: ""
      type: projects
    values:
      layout: work
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: page
